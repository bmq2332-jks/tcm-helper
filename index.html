<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中醫診療助手 V2 — 中醫及傳統整復疑難雜症解答（知識庫擴充版）</title>
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1a4a3a;
    --primary-light: #2d6b55;
    --primary-dark: #0f2e24;
    --accent: #c4956a;
    --accent-light: #e8c9a6;
    --bg: #f7f3ee;
    --bg-card: #ffffff;
    --text: #2c2c2c;
    --text-light: #6b6b6b;
    --border: #ddd6cc;
    --success: #4a8c6f;
    --warning: #c4956a;
    --danger: #c0392b;
    --info: #5b7e9e;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ===== Layout ===== */
  .app-container {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px;
  }

  /* ===== Header ===== */
  header {
    text-align: center;
    padding: 40px 20px 30px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: var(--radius);
    margin-bottom: 28px;
    color: #fff;
    box-shadow: var(--shadow);
    position: relative;
  }
  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 2px;
  }
  header h1 .icon { font-size: 1.8rem; }
  header p {
    margin-top: 8px;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  header .badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    font-size: 0.75rem;
    letter-spacing: 1px;
  }
  header .credit {
    display: block;
    text-align: right;
    font-size: 0.75rem;
    opacity: 0.7;
    margin-top: 10px;
    letter-spacing: 1px;
  }

  /* ===== Login Overlay ===== */
  .login-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .login-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .login-box {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 48px 40px 40px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  }
  .login-box .logo {
    font-size: 2.8rem;
    margin-bottom: 8px;
  }
  .login-box h2 {
    color: #fff;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .login-box p {
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    margin-bottom: 28px;
  }
  .login-box input[type="text"] {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
    letter-spacing: 4px;
    box-sizing: border-box;
  }
  .login-box input[type="text"].pwd-hidden {
    -webkit-text-security: disc;
  }
  .login-box input[type="text"].pwd-visible {
    -webkit-text-security: none;
  }
  .login-box input[type="text"]::placeholder {
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
  }
  .login-box input[type="text"]:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.1);
  }

  /* Password wrapper */
  .password-wrapper {
    position: relative;
    width: 100%;
  }
  .toggle-pwd-btn {
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
    z-index: 1;
  }
  .toggle-pwd-btn:hover {
    color: #fff;
  }
  .toggle-pwd-btn svg {
    overflow: visible;
    width: 22px;
    height: 22px;
  }
  .login-box .login-btn {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--primary-dark);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 2px;
  }
  .login-box .login-btn:hover {
    background: var(--accent-light);
    transform: translateY(-1px);
  }
  .login-box .login-btn:active {
    transform: scale(0.97);
  }
  .login-box .login-error {
    color: #e8a098;
    font-size: 0.85rem;
    margin-top: 14px;
    min-height: 24px;
    visibility: hidden;
  }
  .login-box .login-error.show {
    visibility: visible;
  }
  .login-box .login-hint {
    color: rgba(255,255,255,0.25);
    font-size: 0.75rem;
    margin-top: 20px;
  }

  /* ===== Search Box ===== */
  .search-section {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .search-section label {
    display: block;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--primary);
    font-size: 0.95rem;
  }
  .search-row {
    display: flex;
    gap: 10px;
  }
  .search-row input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    background: var(--bg);
    color: var(--text);
  }
  .search-row input:focus {
    border-color: var(--primary-light);
    background: #fff;
  }
  .search-row input::placeholder {
    color: var(--text-light);
    opacity: 0.6;
  }
  .search-row button {
    padding: 12px 28px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .search-row button:hover { background: var(--primary-light); }
  .search-row button:active { transform: scale(0.97); }

  .search-tips {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .search-tips .tag {
    padding: 4px 12px;
    border-radius: 16px;
    background: var(--accent-light);
    color: var(--primary-dark);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .search-tips .tag:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ===== Condition List ===== */
  .condition-list-section {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .condition-list-section h2 {
    font-size: 1.1rem;
    color: var(--primary);
    margin-bottom: 14px;
  }
  .condition-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }
  .condition-grid .item {
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--bg);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
    border: 1px solid transparent;
  }
  .condition-grid .item:hover {
    background: var(--accent-light);
    border-color: var(--accent);
  }

  /* ===== Result Card ===== */
  .result-card {
    display: none;
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .result-card.active { display: block; }
  .result-card .match-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    background: var(--success);
    color: #fff;
    font-size: 0.75rem;
    margin-bottom: 12px;
  }

  /* Sections inside result */
  .result-section {
    margin-top: 28px;
  }
  .result-section:first-of-type { margin-top: 0; }
  .result-section h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.1rem;
    color: var(--primary);
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent-light);
    margin-bottom: 14px;
  }
  .result-section p, .result-section li {
    color: var(--text);
    line-height: 1.8;
  }

  /* Pattern Table */
  .pattern-table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 0.9rem;
  }
  .pattern-table th {
    background: var(--primary);
    color: #fff;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
  }
  .pattern-table th:first-child { border-radius: 6px 0 0 0; }
  .pattern-table th:last-child { border-radius: 0 6px 0 0; }
  .pattern-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .pattern-table tr:nth-child(even) { background: #faf8f5; }
  .pattern-table tr:hover { background: var(--accent-light); }

  /* Acupoint list */
  .acupoint-item {
    padding: 12px 16px;
    margin: 6px 0;
    border-left: 3px solid var(--success);
    background: #f8fbf9;
    border-radius: 0 8px 8px 0;
  }
  .acupoint-item strong { color: var(--primary); }
  .acupoint-item .meta {
    display: block;
    font-size: 0.85rem;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* Osteopathy list */
  .osteo-item {
    padding: 12px 16px;
    margin: 6px 0;
    border-left: 3px solid var(--info);
    background: #f5f8fa;
    border-radius: 0 8px 8px 0;
  }
  .osteo-item strong { color: var(--info); }

  /* Diet list */
  .diet-item {
    padding: 12px 16px;
    margin: 6px 0;
    border-left: 3px solid var(--accent);
    background: #fdf9f5;
    border-radius: 0 8px 8px 0;
  }
  .diet-item strong { color: var(--accent); }
  .diet-item .meta {
    display: block;
    font-size: 0.85rem;
    color: var(--text-light);
  }

  /* Lifestyle */
  .lifestyle-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 600px) { .lifestyle-grid { grid-template-columns: 1fr; } }
  .lifestyle-do, .lifestyle-dont {
    padding: 14px;
    border-radius: 8px;
  }
  .lifestyle-do {
    background: #eaf5ee;
    border: 1px solid #c8e0d3;
  }
  .lifestyle-dont {
    background: #fceeec;
    border: 1px solid #f0d4d0;
  }
  .lifestyle-do h4, .lifestyle-dont h4 {
    font-size: 0.9rem;
    margin-bottom: 6px;
  }
  .lifestyle-do ul, .lifestyle-dont ul {
    list-style: none;
    padding: 0;
  }
  .lifestyle-do ul li::before { content: "✅ "; }
  .lifestyle-dont ul li::before { content: "❌ "; }
  .lifestyle-do ul li, .lifestyle-dont ul li {
    font-size: 0.85rem;
    padding: 3px 0;
  }

  /* See Doctor */
  .see-doctor {
    background: #fff8e6;
    border: 1px solid #f0e0b8;
    border-radius: 8px;
    padding: 14px;
  }
  .see-doctor ul {
    list-style: none;
    padding: 0;
  }
  .see-doctor ul li::before { content: "⚠️ "; }
  .see-doctor ul li {
    font-size: 0.9rem;
    padding: 4px 0;
  }

  /* ===== Disclaimer ===== */
  .disclaimer {
    background: #fff8e6;
    border-left: 4px solid var(--warning);
    padding: 14px 18px;
    border-radius: 6px;
    margin-top: 24px;
    font-size: 0.85rem;
    color: #7a6a3a;
  }
  .disclaimer strong { color: var(--danger); }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    padding: 20px;
    color: var(--text-light);
    font-size: 0.8rem;
  }
  footer a { color: var(--primary); text-decoration: none; }

  /* ===== Loading ===== */
  .loading {
    display: none;
    text-align: center;
    padding: 20px;
    color: var(--text-light);
  }
  .loading.active { display: block; }
  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Empty State ===== */
  .empty-state {
    display: none;
    text-align: center;
    padding: 40px;
    color: var(--text-light);
  }
  .empty-state.active { display: block; }
  .empty-state .icon { font-size: 3rem; margin-bottom: 10px; }

  /* ===== Multiple Results ===== */
  .result-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .result-tabs .tab {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .result-tabs .tab:hover { border-color: var(--primary-light); }
  .result-tabs .tab.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* ===== Print ===== */
  @media print {
    .search-section, .condition-list-section, .result-tabs, footer { display: none; }
    .result-card { box-shadow: none; padding: 0; }
    header { background: var(--primary) !important; }
  }

  /* ===== Logout Button ===== */
  .logout-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 6px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 100;
    display: none;
  }
  .logout-btn:hover {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }
  .logout-btn.show {
    display: block;
  }
</style>
</head>
<body>

<!-- Login Overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="logo">🏥</div>
    <h2>中醫診療助手</h2>
    <p>請輸入密碼以繼續使用</p>
    <div class="password-wrapper">
      <input type="text" id="passwordInput" class="pwd-hidden" placeholder="請輸入密碼" maxlength="20" autocomplete="off" />
      <button type="button" class="toggle-pwd-btn" id="togglePwdBtn" onclick="togglePassword()" aria-label="顯示密碼">
        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <button class="login-btn" id="loginBtn" onclick="handleLogin()">進入</button>
    <div class="login-error" id="loginError">⚠️ 密碼錯誤，請重新輸入</div>
    <div class="login-hint">僅供授權使用者</div>
  </div>
</div>

<div class="app-container" id="appContainer" style="display:none;">

  <!-- Header -->
  <header>
    <button class="logout-btn" id="logoutBtn" onclick="handleLogout()">🚪 登出</button>
    <h1><span class="icon">🏥</span> 中醫診療助手</h1>
    <p>中醫及傳統整復 — 疑難雜症智慧解答</p>
    <span class="badge">🌿 辨證論治 · 經絡穴位 · 整復保健 · 藥膳食療</span>
    <span class="credit">製作程式：國祥</span>
  </header>

  <!-- Search Section -->
  <div class="search-section">
    <label for="symptom-input">🔍 請輸入您的症狀或不舒服的部位</label>
    <div class="search-row">
      <input type="text" id="symptom-input" placeholder="例如：頭痛、肩頸酸痛、失眠、腰酸背痛…" />
      <button onclick="handleSearch(true)">查詢</button>
    </div>
    <div class="search-tips" id="search-tips"></div>
  </div>

  <!-- Condition List -->
  <div class="condition-list-section" id="condition-list-section">
    <h2>📋 可查詢的常見症狀</h2>
    <div class="condition-grid" id="condition-grid"></div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="margin-top:10px;">正在分析您的症狀…</p>
  </div>

  <!-- Empty State -->
  <div class="empty-state" id="empty-state">
    <div class="icon">🤔</div>
    <p>目前知識庫中未有完全匹配的症狀</p>
    <p style="font-size:0.85rem;margin-top:6px;">請嘗試更具體的關鍵詞，例如：頭痛、肩頸酸痛、腰酸背痛、膝蓋痛、失眠</p>
  </div>

  <!-- Result Area -->
  <div id="result-container"></div>

  <!-- Footer -->
  <footer>
    <p>⚕️ 本工具僅供保健參考，不構成醫療診斷或處方。如有持續不適，請諮詢專業醫師。</p>
    <p style="margin-top:4px;">中醫診療助手 v2.0 &copy; 2026</p>
  </footer>

</div>  <!-- /app-container -->

<script>
// ============================================================
// 中醫知識庫 V2 — 24 個症狀條件（與 Python CLI 同步）
// ============================================================
const TCM_KNOWLEDGE_BASE = [
  {
    condition: "頭痛（肝陽上亢型）",
    keywords: ["頭痛", "偏頭痛", "太陽穴", "頭脹", "頭暈", "血壓高"],
    analysis: "肝陽上亢型頭痛多因情志不遂、肝鬱化火，或肝腎陰虛、陰不制陽，導致肝陽上擾清竅。常見於工作壓力大、熬夜、易怒人群。",
    patterns: [
      ["肝陽上亢", "頭脹痛、眩暈耳鳴、面紅目赤、心煩易怒", "舌紅苔黃、脈弦數"],
      ["肝腎陰虛", "頭痛綿綿、眩暈耳鳴、腰膝酸軟、五心煩熱", "舌紅少苔、脈細數"],
      ["瘀血阻絡", "頭痛如刺、痛有定處、夜間加重、久病不癒", "舌紫暗有瘀斑、脈澀"],
    ],
    acupoints: [
      { name: "太衝穴", loc: "足背第一、二蹠骨結合部前方凹陷中", method: "拇指按壓，用力向下，每次3分鐘，雙腳交替", effect: "疏肝降逆，平肝潛陽" },
      { name: "風池穴", loc: "後頸部，枕骨下方凹陷處", method: "雙手拇指按揉，由輕漸重，每次2分鐘", effect: "祛風通絡，清頭明目" },
      { name: "太陽穴", loc: "眉梢與外眼角之間向後一橫指凹陷", method: "食指中指並攏按揉，順時針畫圈，每次1分鐘", effect: "疏風散熱，通絡止痛" },

/** 初始化：列出所有症狀、設定快捷標籤 */
function init() {
  const grid = document.getElementById("condition-grid");
  const tips = document.getElementById("search-tips");
  grid.innerHTML = "";
  tips.innerHTML = "";

  const used = new Set();
  TCM_KNOWLEDGE_BASE.forEach((item, idx) => {
    // 添加到網格
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = item.condition;
    div.onclick = () => showResult(item);
    grid.appendChild(div);

    // 將前 2 個關鍵詞當作標籤
    item.keywords.slice(0, 2).forEach(kw => {
      if (used.size >= 16) return;
      if (!used.has(kw)) {
        used.add(kw);
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = kw;
        tag.onclick = () => {
          document.getElementById("symptom-input").value = kw;
          handleSearch(false);
        };
        tips.appendChild(tag);
      }
    });
  });

  // Enter key 觸發搜尋
  document.getElementById("symptom-input").addEventListener("keydown", e => {
    if (e.key === "Enter") handleSearch(false);
  });
}

/** 處理搜尋 */
function handleSearch(shouldScroll = false) {
  const query = document.getElementById("symptom-input").value.trim();
  if (!query) return;

  showLoading(true);
  hideEmptyState();
  clearResults();

  // 微延遲以顯示 loading（模擬思考）
  setTimeout(() => {
    const matches = matchConditions(query);
    showLoading(false);

    if (matches.length === 0) {
      showEmptyState();
      return;
    }

    renderResults(matches, shouldScroll);
  }, 300);
}

/** 匹配引擎 */
function matchConditions(query) {
  const scored = [];
  TCM_KNOWLEDGE_BASE.forEach((item, idx) => {
    let score = 0;
    // 關鍵詞匹配
    item.keywords.forEach(kw => {
      if (query.includes(kw)) score += 3;
      else if (kw.includes(query)) score += 1;
    });
    // 症狀名稱匹配
    if (query.includes(item.condition)) score += 5;
    // 簡單文字相似度
    const sim = similarity(query, item.condition);
    score += sim * 2;

    if (score > 0) scored.push({ score, idx, item });
  });

  scored.sort((a, b) => b.score - a.score);
  return scored;
}

/** 簡單文字相似度（基於共同子字串） */
function similarity(a, b) {
  let common = 0;
  for (let i = 0; i < a.length; i++) {
    for (let j = i + 1; j <= a.length; j++) {
      if (b.includes(a.substring(i, j))) {
        common = Math.max(common, j - i);
      }
    }
  }
  return (2.0 * common) / (a.length + b.length);
}

/** 渲染結果 */
function renderResults(matches, shouldScroll = false) {
  const container = document.getElementById("result-container");
  container.innerHTML = "";

  // Tab 切換（多筆結果）
  if (matches.length > 1) {
    const tabBar = document.createElement("div");
    tabBar.className = "result-tabs";
    matches.slice(0, 3).forEach((m, i) => {
      const tab = document.createElement("span");
      tab.className = "tab" + (i === 0 ? " active" : "");
      tab.textContent = m.item.condition;
      tab.onclick = () => switchTab(i);
      tabBar.appendChild(tab);
    });
    container.appendChild(tabBar);

    // 儲存 tab 列表供切換
    container._tabs = tabBar;
  }

  // 渲染結果卡片（最多 3 筆）
  matches.slice(0, 3).forEach((m, i) => {
    const card = createResultCard(m.item, m.score, i);
    container.appendChild(card);
  });

  // 顯示第 0 筆
  showTab(0);

  // 僅在按下「查詢」按鈕時，才滾動到症狀分析
  if (shouldScroll) {
    setTimeout(() => {
      const firstCard = container.querySelector(".result-card.active");
      if (firstCard) {
        const analysisSection = firstCard.querySelector("[id^='symptom-analysis-']");
        if (analysisSection) {
          analysisSection.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    }, 100);
  }
}

        </div>

    </div>

  return card;

/** 切換顯示哪個 tab */
function switchTab(index) {
  const container = document.getElementById("result-container");
  const tabs = container._tabs;
  if (tabs) {
    Array.from(tabs.children).forEach((t, i) => {
      t.classList.toggle("active", i === index);
    });
  }
  showTab(index);
}

function showTab(index) {
  const container = document.getElementById("result-container");
  Array.from(container.querySelectorAll(".result-card")).forEach(c => {
    c.classList.toggle("active", parseInt(c.dataset.index) === index);
  });
}

function showResult(item) {
  // 直接從條件清單點擊
  document.getElementById("symptom-input").value = item.condition;
  handleSearch();
}

function showLoading(show) {
  document.getElementById("loading").classList.toggle("active", show);
}

function showEmptyState() {
  document.getElementById("empty-state").classList.add("active");
}

function hideEmptyState() {
  document.getElementById("empty-state").classList.remove("active");
}

function clearResults() {
  const container = document.getElementById("result-container");
  container.innerHTML = "";
}

// ============================================================
// 登入邏輯
// ============================================================

const CORRECT_PASSWORD = "87654321";

function handleLogin() {
  const input = document.getElementById("passwordInput");
  const error = document.getElementById("loginError");
  const password = input.value.trim();

  if (password === CORRECT_PASSWORD) {
    // 登入成功
    localStorage.setItem("tcm_helper_logged_in", "true");
    enterApp();
  } else {
    // 密碼錯誤
    error.classList.add("show");
    input.value = "";
    input.focus();
    input.style.borderColor = "#d46a5e";
    setTimeout(() => {
      input.style.borderColor = "rgba(255,255,255,0.15)";
    }, 800);
  }
}

// ============================================================
// 密碼顯示/隱藏切換
// ============================================================

function togglePassword() {
  const input = document.getElementById("passwordInput");
  const eyeOpen = document.getElementById("eyeOpen");
  const eyeClosed = document.getElementById("eyeClosed");
  const isHidden = input.classList.contains("pwd-hidden");

  if (isHidden) {
    // 隱藏 → 顯示明文：閉眼 → 開眼
    input.classList.remove("pwd-hidden");
    input.classList.add("pwd-visible");
    eyeClosed.style.display = "none";
    eyeOpen.style.display = "block";
  } else {
    // 顯示明文 → 隱藏：開眼 → 閉眼
    input.classList.remove("pwd-visible");
    input.classList.add("pwd-hidden");
    eyeOpen.style.display = "none";
    eyeClosed.style.display = "block";
  }
}

function enterApp() {
  const overlay = document.getElementById("loginOverlay");
  const app = document.getElementById("appContainer");
  const logoutBtn = document.getElementById("logoutBtn");

  // 淡出登入畫面
  overlay.classList.add("hidden");

  // 延遲顯示主畫面（等淡出動畫完成）
  setTimeout(() => {
    overlay.style.display = "none";
    app.style.display = "block";
    logoutBtn.classList.add("show");
    init();
  }, 500);
}

function handleLogout() {
  localStorage.removeItem("tcm_helper_logged_in");
  const overlay = document.getElementById("loginOverlay");
  const app = document.getElementById("appContainer");
  const logoutBtn = document.getElementById("logoutBtn");
  const pwInput = document.getElementById("passwordInput");

  // 淡出主畫面
  app.style.display = "none";
  logoutBtn.classList.remove("show");

  // 顯示登入畫面
  overlay.style.display = "flex";
  overlay.classList.remove("hidden");

  // 清空密碼欄並聚焦
  if (pwInput) {
    pwInput.value = "";
    pwInput.focus();
  }
}

function checkLogin() {
  if (localStorage.getItem("tcm_helper_logged_in") === "true") {
    enterApp();
  } else {
    // 顯示登入畫面（預設可見），隱藏主畫面
    document.getElementById("appContainer").style.display = "none";
    document.getElementById("passwordInput").focus();
  }
}

// Enter key 觸發登入
document.addEventListener("DOMContentLoaded", () => {
  const pwInput = document.getElementById("passwordInput");
  if (pwInput) {
    pwInput.addEventListener("keydown", e => {
      if (e.key === "Enter") handleLogin();
    });
  }
  checkLogin();
});
